name: Build Package and Update Repo DB

on:
  push:
    branches:
      - main
    paths:
      - '**/PKGBUILD'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      # 1. コードのチェックアウト（ホスト側で行うのでGit情報は完全に保持されます）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Arch Linuxのコンテナ内でビルドとDB更新だけを安全に実行する
      - name: Build packages and update DB (Inside Container)
        uses: docker://archlinux:latest
        with:
          args: >
            bash -c "
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm base-devel git sudo &&
            useradd -m builder &&
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers &&
            chown -R builder:builder ./ &&
            sudo -u builder bash -c '
              set -e
              ROOT_DIR=\$(pwd)
              find . -name PKGBUILD | while read -r pkgbuild_path; do
                pkg_dir=\$(dirname \"\$pkgbuild_path\")
                echo \"📦 Building package in \$pkg_dir ...\"
                cd \"\$ROOT_DIR/\$pkg_dir\"
                makepkg -s --noconfirm
                mv *.pkg.tar.zst \"\$ROOT_DIR/\" 2>/dev/null || true
              done
              cd \"\$ROOT_DIR\"
              if ! ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                echo \"⚠️ パッケージファイルが見つかりません。\"
                exit 1
              fi
              echo \"🗄️ Updating custom repository database...\"
              REPO_NAME=\"myrepo\"
              DB_FILE=\"\${REPO_NAME}.db.tar.zst\"
              repo-add --remove \"\$DB_FILE\" *.pkg.tar.zst
              rm -f \"\${REPO_NAME}.db\" \"\${REPO_NAME}.files\"
              cp \"\$DB_FILE\" \"\${REPO_NAME}.db\"
              cp \"\${REPO_NAME}.files.tar.zst\" \"\${REPO_NAME}.files\"
            '
            "

      # 3. ホスト側（安全なGit環境）に戻ってプッシュを実行する
      - name: Commit and push changes (Host Side)
        run: |
          # コンテナ内で書き換えられたファイルの所有権を一時的に戻す
          sudo chown -R $USER:$USER .
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          git add *.pkg.tar.zst myrepo.db* myrepo.files*
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated build: Update packages and repo DB [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
